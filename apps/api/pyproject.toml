[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS AI backend API (FastAPI)."
requires-python = ">=3.12,<3.13"
# Ranges are bounded to the current major/minor line; exact versions are pinned in uv.lock.
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30,<0.33",
    "alembic>=1.16,<2",
    "structlog>=25,<27",
    # --- M1: document ingestion and semantic retrieval ---
    "python-multipart>=0.0.20,<0.1",   # multipart/form-data parsing for UploadFile
    "pypdf>=7.2,<8",                   # PDF validation and text extraction (BSD-3-Clause)
    "sentence-transformers>=6.3,<7",   # Hugging Face embedding model runtime
    "torch>=2.15,<2.16",               # CPU-only wheels, see [tool.uv.sources]
    "pgvector>=0.5,<0.6",              # SQLAlchemy Vector type
    "numpy>=2,<3",                     # embedding arrays (imported directly)
]

[dependency-groups]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "httpx>=0.28,<0.29",
    "asgi-lifespan>=2.1,<3",
]

# CPU-only PyTorch: the default Linux wheel pulls ~3 GB of CUDA libraries we never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
nexus-api = "nexus_api.main:run"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade (modern syntax)
    "N",        # naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "S",        # bandit-style security checks
    "PT",       # pytest style
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nexus_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fake credentials are expected in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "migrations"]
warn_unreachable = true

[[tool.mypy.overrides]]
# asyncpg ships no type information. Application code uses it only for exception
# classes (db/health.py); everything else goes through SQLAlchemy, which is typed.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "integration: requires running infrastructure (PostgreSQL). Deselect with -m 'not integration'.",
    "model: requires the real embedding model in the local cache (`make models`). Deselect with -m 'not model'.",
]
filterwarnings = ["error"]
